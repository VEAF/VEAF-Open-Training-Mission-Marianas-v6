# mission.yaml — generated by `veaf-tools prepare`. Edit freely.
# Run `veaf-tools validate` to check it, then `veaf-tools build`.

# ── Guide rapide de syntaxe YAML ────────────────────────────────────────────
# Indentation : espaces uniquement (pas de tabulations). Chaque niveau = 2 espaces.
# Guillemets : uniquement si la valeur contient  :  #  {  [  ou commence par un chiffre.
#   name: Mon-Vol-01            # OK — pas de guillemets
#   name: "Vol: Aller-Retour"   # obligatoire — contient :
#   Aussi obligatoires si la valeur contient des séquences d'échappement comme  \n  \t
#   briefing: "Intercept bandits\nRTB when done"  # obligatoire — contient \n
# Texte multiligne : utilisez  |  (bloc littéral) — chaque ligne suivante indentée de 2 espaces supplémentaires.
#   briefing: |
#     deuxième ligne
# Listes : chaque élément sur sa propre ligne, précédé de  -
#   groups:
#     - MIG-29_SOLO
#     - MIG-21_SOLO
# Booléens : true / false  (sans guillemets)
# Valeur vide (modules obligatoires) : MODULE:   (rien après le deux-points)
# ────────────────────────────────────────────────────────────────────────────

# ── Niveau de log global ─────────────────────────────────────────────────────
# Force tous les loggers VEAF à ce niveau. Supprimer ou mettre 'info' en production.
# Valeurs : error | warning | info | debug | trace
# Doc : https://veaf.github.io/documentation/dev/mission-maker/GUIDE/#debug-logging
#
global_log_level: info

# ── Mission ──────────────────────────────────────────────────────────────────
# Identité de la mission (nom, chemin d'export, ère) et options globales (ex. silence_atc_on_all_airbases) — utilisées dans les menus radio et les logs.
mission:
  name: VEAF_OpenTraining_Marianas_ICAO_PGUA   # PGUA = Andersen AFB, base mère ; METAR vivant vérifié le 11/10/2026
  era: MODERN
  language: fr
  silence_atc_on_all_airbases: true
  hide_names_from_spawned_groups: true
#   hide_names_from_spawned_groups: true  # default true: a spawned group is named
#                               # `[r]-<invented name>#<id>` instead of carrying its zone and
#                               # type, so a player cannot read a zone's contents off the F10
#                               # map. Set false while building or debugging a mission.

# ── Sécurité ─────────────────────────────────────────────────────────────────
# Protection par mot de passe pour les accès Mission Master et contrôleur JTF.
# Doc : https://veaf.github.io/documentation/dev/mission-maker/GUIDE/#security-tiers
# security:
#   disabled: true                # true = no password required (default: false — security is active)
#   password_hashes:              # add SHA-1 hashes to restrict access (sha1.hex of the password)
#     - "<SHA-1 hash>"

modules:
  # ── Infrastructure ──
  UNITS:
  TIME:
  CACHE:
  EVENTS:
  MARKERS:
  COMMANDS:
  # ── Core ──
  RADIO: true  # the VEAF F10 radio menu
  SPAWN: true
  SHORTCUTS: true  # built-in aliases (-shilka, -sa2, …)
  INTERPRETER: true
  SECURITY: true   # the /secu verbs (elevate, …); turn the level check off with `security: disabled: true`
  # ── Features ──
  NAMEDPOINTS: true
  MOVE: true
  GRASS: true
  WEATHER: true
  REMOTE: true
  AIRBASES: true
  # ── Combat ──
  GROUNDAI: true  # ground units AI behaviour (required by CASMISSION)
  CASMISSION: true  # `_cas` marker (no config)
  TRANSPORTMISSION: true  # `_transport` marker (no config)
  COMBATMISSION: true
  CARRIER: true  # carrier-operations radio menus
  #   COMBATZONE:
  #     enabled: true
  #     combat_zones:
  #       - type: zone
  #         zone_name: CZ-Alpha
  #         friendly_name: Alpha Zone
  #         training: false
  #   QRA:
  #     enabled: true
  #     definitions:
  #       - name: Base QRA
  #         coalition: RED
  #         enemy_coalitions: [BLUE]
  #         trigger_zone: QRA zone
  #         zone_radius: 30000
  #         groups_by_enemy_count:
  #           - enemy_count: 1
  #             groups: [Group1, Group2]
  #             random_pick: 1
  #   AIRWAVES:
  #     enabled: true
  #     airwave_zones:
  #       - name: BVR Zone
  #         start: true
  #         player_coalitions: [BLUE]
  #         zone_center_coordinates: "N41°00'00\" E044°00'00\""
  #         zone_radius: 50000
  #         waves:
  #           - groups: su27-2ship
  #             delay: 0
  #   ASSETS:
  #     enabled: true
  #     assets:
  #       - sort: 1
  #         name: T1-Arco-1
  #         description: Arco-1 (KC-135)
  #         information: "Tacan 64Y\nU290.50 (20)"
  #   SANCTUARY:
  #     enabled: true
  #     sanctuary_zones:
  #       - name: Base Alpha
  #         polygon_units:          # or a circle: trigger_zone: SANCT Alpha
  #           - Sanctuary-Unit-1
  #         coalition: BLUE
  #         delay_warning: 30
  #         delay_spawn: 60
  # ── Community ──
  STTS: true
  CTLD:                      # settings live in ctld-config.yaml (edit it with ctld-tools)
    enabled: true
    manage_logistics: true   # every carrier and FARP ammo dump becomes a CTLD loading point;
                             # set to false to own logisticUnitTypes/troopZoneShipTypes yourself
    manage_airbase_logistics: true   # every airdrome becomes a CTLD logistic zone, held over time;
                                     # false opts out entirely: no zone, no tick, no map circle
    airbase_logistics_radius: 1500   # Andersen : parkings gros porteurs étalés sur ~3 km (v5) ; 1 100 m mesurés à Ramstein, à remesurer ici
    airbase_occupation_radius: 2000  # metres a captured or neutral field probes for ground units
    airbase_logistics_tick: 30       # seconds between two evaluations of every airfield
  CSAR: true
  AIEN: true
  SKYNET:
    enabled: true
    spotter_network: true      # les unités au sol voient les avions et relaient le contact
    spotter_view: "off"        # ni affichage F10 ni interrupteur radio
  # TUM requires BLUFOR/REDFOR territory trigger zones (each owning an airbase) placed
  # in the Mission Editor, or it aborts at start-up. Uncomment once the zones exist:
  #   TUM: true

# ── Pipeline de build ─────────────────────────────────────────────────────────
# Contrôle les étapes d'injection optionnelles après le build de base.
# Chaque étape auto-détecte son fichier de config ; mettre à false pour ignorer.
# Doc : https://veaf.github.io/documentation/dev/mission-maker/GUIDE/#build-profiles
#
# pipeline:
#   presets: true                 # src/presets.yaml
#   waypoints: true               # src/waypoints.yaml
#   spawnable_aircrafts: true     # src/spawnables.yaml
#   dynamic_slot_templates: true  # src/dynamic-slot-templates.yaml
#   warehouses: true              # src/warehouses.yaml (Dynamic-Slot warehouses)
#   spawn_data: true              # always on; src/spawn-groups.yaml extends the spawn DB
#   weather: true                 # src/versions.yaml
