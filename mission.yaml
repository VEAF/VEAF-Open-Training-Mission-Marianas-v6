pipeline:
  weather: false                # pas de variantes météo : le serveur VEAF fixe météo et heure (David, 12/10/2026)

# ── Profils de build ─────────────────────────────────────────────────────────
# Par défaut = serveur VEAF : sécurité active, logs info, toutes les variantes météo.
# `veaf-tools build --profile LOCAL_TEST` : test local rapide.
profiles:
  LOCAL_TEST:
    global_log_level: debug
    security:
      disabled: true
    mission:
      hide_names_from_spawned_groups: false
    pipeline:
      weather: false
cap_missions:
  - group_name: CAP-Tinian-MiG29
    menu_name: CAP rouge MiG-29 (Fox 1) — Tinian — FL220
    briefing: "Deux MiG-29S armés de R-27R et R-73 patrouillent au-dessus de Tinian et d'Aguijan, au FL220. Emport : R-73*4,R-27R*2."
  - group_name: CAP-Saipan-J11
    menu_name: CAP rouge J-11A (Fox 3) — Saipan — FL250
    briefing: Deux J-11A armés de R-77 et R-73 patrouillent à l'est de Saipan, au FL250.
  - group_name: CAP-Anatahan-MiG31
    menu_name: CAP rouge MiG-31 (intercepteur haut et rapide) — Anatahan — FL400
    briefing: 'Deux MiG-31 patrouillent haut et vite entre Anatahan et Sarigan, au FL400. Emport : R-40R*2,R-33*4.'
  - group_name: Raid-Saipan-Tu22
    menu_name: Raid rouge Tu-22M3 à intercepter — nord de Saipan — FL250
    briefing: 'Deux Tu-22M3 chargés de bombes tournent au nord de Saipan, au FL250, prêts à frapper Guam : les intercepter. Emport : FAB-250*69.'
  - group_name: CAP-Guam-F16
    menu_name: CAP bleue F-16 (Fox 3) — nord de Guam — FL220
    briefing: 'Deux F-16C patrouillent au nord de Guam, entre North West Field et le détroit de Rota, au FL220. Emport : AIM-120C*4, AIM-9M*2, Fuel.'
  - group_name: CAP-Tarawa-F15
    menu_name: CAP bleue F-15 (Fox 3) — Tarawa — FL250
    briefing: 'Deux F-15C couvrent le groupe amphibie du Tarawa, à l''est de Rota, au FL250. Emport : AIM-9*4,AIM-120*4,Fuel.'

# ── Missions scénarisées (module COMBATMISSION) — écrites par tools/gen_11_config.py ──
combat_missions:
  - name: Defense-Andersen
    friendly_name: Défense — raid sur Andersen
    secured: false
    briefing: "Deux Su-30 armés de missiles antiradar ouvrent la route à deux Tu-22M3 escortés de J-11A, partis de Tinian vers Andersen. Abattez les bombardiers avant le largage. Échec si la base est bombardée (constaté par vous : la mission ne le vérifie pas)."
    elements:
      - name: SEAD
        groups:
          - SC-Defense-Andersen-SEAD
        scalable: false
      - name: Bombardiers
        groups:
          - SC-Defense-Andersen-Tu22
        scalable: false
      - name: Escorte
        groups:
          - SC-Defense-Andersen-Escort
        scalable: true
  - name: Interception-VIP
    friendly_name: Interception — transport VIP de Saipan à Pagan
    secured: false
    briefing: "Un IL-76 emmène l'état-major de la force rouge de Saipan vers Pagan, escorté par deux J-11A. Interceptez-le avant Pagan : la fin de la route est sous le SA-10 de Pagan."
    elements:
      - name: Transport
        groups:
          - SC-Intercept-VIP-Il76
        scalable: false
      - name: Escorte
        groups:
          - SC-Intercept-VIP-Escort
        scalable: true
  - name: Protection-Overlord
    friendly_name: Protection — raid de J-11A sur Overlord 1
    secured: false
    briefing: "Quatre J-11A arrivent de la mer, au nord-est de Saipan, pour abattre l'AWACS Overlord 1 sur son orbite, à l'est de Saipan. Interceptez-les avant qu'ils ne l'atteignent ; son escorte de F-15C ne suffira pas."
    elements:
      - name: Raid
        groups:
          - SC-Protect-Overlord-J11
        scalable: true
