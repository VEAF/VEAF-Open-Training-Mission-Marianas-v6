# Variantes météo et horaires de l'Open Training Mariannes (une .miz par entrée).
# Réel = METAR d'Andersen (PGUA) récupéré au build ; dégagé = même météo plafonnée VFR (clearsky) ;
# épars / pluie = météo manuelle d'alizé (vent d'est-nord-est), et averse tropicale sous plafond bas.
# Le build compose le ${METAR} du briefing des variantes manuelles. Le profil LOCAL_TEST coupe ce pipeline.
# Date : mi-mars, saison sèche, alizés établis.
position:
